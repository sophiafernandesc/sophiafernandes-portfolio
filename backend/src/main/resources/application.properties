spring.application.name=portfolio

# Credenciais de desenvolvimento ficam em backend/local.properties, que o
# .gitignore barra. O 'optional:' e essencial: sem o arquivo (Render, CI, clone
# novo) a aplicacao sobe do mesmo jeito, lendo as variaveis de ambiente.
spring.config.import=optional:file:./local.properties

# O Render injeta PORT; na máquina vale o 8080 que o front-end procura por padrao.
server.port=${PORT:8080}
# Atrás do proxy do Render, é isto que faz getRemoteAddr devolver o IP real.
server.forward-headers-strategy=framework

# Sem página de erro em HTML: a API só responde JSON.
server.error.whitelabel.enabled=false

# Origens do front-end. Em producao, o apex: https://sophiafernandes.dev
app.cors.origens=${CORS_ORIGIN:http://localhost:5173}

# Caixa que recebe o formulário e conta que assina o envio.
app.contato.destinatario=${CONTATO_DESTINATARIO:sophiaferch@gmail.com}
# O remetente era sempre o usuario do SMTP. Com um relay (Brevo, Mailjet), o
# usuario e um identificador da conta, nao um endereco valido para o campo De.
# CONTATO_REMETENTE separa os dois; sem ele, o comportamento antigo continua.
app.contato.remetente=${CONTATO_REMETENTE:${SMTP_USUARIO:}}

spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORTA:587}
spring.mail.username=${SMTP_USUARIO:}
spring.mail.password=${SMTP_SENHA:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
# Sem timeout, um SMTP travado prende a thread e o formulário fica girando.
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Desligado por padrão para o desenvolvimento local não exigir desafio a cada envio.
# Em producao: RECAPTCHA_HABILITADO=true e a secret key preenchida.
app.recaptcha.habilitado=${RECAPTCHA_HABILITADO:false}
app.recaptcha.secret=${RECAPTCHA_SECRET:}
app.recaptcha.url-verificacao=https://www.google.com/recaptcha/api/siteverify

# Teto para a chamada ao Google, pelo mesmo motivo dos timeouts de SMTP.
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=5s
